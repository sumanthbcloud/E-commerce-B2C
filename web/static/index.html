<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce B2C | Enterprise Microservices Storefront</title>
    <link rel="stylesheet" href="/css/style.css">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
</head>
<body>
    <!-- Global Header -->
    <header class="site-header">
        <div class="header-top">
            <a href="/" data-link class="brand-logo">
                <span class="brand-icon">⚡</span>
                <span>E-Commerce B2C</span>
            </a>

            <div class="search-container">
                <form id="header-search-form" class="search-form">
                    <button type="submit" class="search-icon-btn" aria-label="Search">🔍</button>
                    <input id="header-search-input" type="search" placeholder="Search products, categories..." class="search-input" autocomplete="off">
                </form>
            </div>

            <div class="header-actions">
                <a id="header-account-link" href="/login" data-link class="action-link">
                    <span>👤</span>
                    <span>Account</span>
                </a>
                <a href="/cart" data-link class="action-link cart-btn">
                    <span>🛒</span>
                    <span>Cart</span>
                    <span id="cart-badge" class="cart-badge" style="display: none;">0</span>
                </a>
            </div>
        </div>

        <nav class="header-categories-bar">
            <div id="header-categories" class="header-categories-list">
                <!-- Dynamically populated categories -->
            </div>
        </nav>
    </header>

    <!-- Main Dynamic Application Content Container -->
    <main id="main-content" class="main-wrapper" role="main">
        <div class="loading-state">Initializing E-Commerce B2C...</div>
    </main>

    <!-- Toast Notification Overlay -->
    <div id="toast" class="toast" role="alert" aria-live="polite"></div>

    <!-- Global Footer -->
    <footer class="site-footer">
        <div class="footer-inner">
            <p>&copy; 2026 E-Commerce B2C Microservices Architecture.</p>
            <p>Cloud Native &bull; Polyglot &bull; Resilient</p>
        </div>
    </footer>

    <!-- Modular Vanilla Frontend Scripts (Zero build tooling) -->
    <script src="/js/api.js"></script>
    <script src="/js/store.js"></script>
    <script src="/js/router.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
