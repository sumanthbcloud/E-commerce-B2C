<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUM Store | Smart Technology for Modern Life</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css?v=2.0.1">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
</head>
<body>
    <!-- Global Header -->
    <header class="site-header">
        <div class="header-top">
            <a href="/" data-link class="brand-logo">
                <span class="brand-sum">SUM</span>
                <span class="brand-store">Store</span>
                <span class="brand-accent-dot"></span>
            </a>

            <div class="search-container">
                <form id="header-search-form" class="search-form">
                    <span class="search-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    </span>
                    <input id="header-search-input" type="search" placeholder="Search products, SKUs, or categories..." class="search-input" autocomplete="off">
                    <button type="submit" class="search-submit-btn">Search</button>
                </form>
            </div>

            <div class="header-actions">
                <a id="header-account-link" href="/login" data-link class="header-action-item">
                    <svg class="action-svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    <div class="action-text">
                        <span class="action-sub">Welcome</span>
                        <span class="action-main">Account</span>
                    </div>
                </a>
                <a href="/cart" data-link class="header-action-item cart-action-item">
                    <div class="cart-icon-wrapper">
                        <svg class="action-svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
                        <span id="cart-badge" class="cart-badge" style="display: none;">0</span>
                    </div>
                    <div class="action-text">
                        <span class="action-sub">Shopping</span>
                        <span class="action-main">Cart</span>
                    </div>
                </a>
            </div>
        </div>

        <nav class="header-categories-bar">
            <div class="categories-bar-inner">
                <span class="categories-label">Categories:</span>
                <div id="header-categories" class="header-categories-list">
                    <!-- Dynamically populated categories -->
                </div>
            </div>
        </nav>
    </header>

    <!-- Main Dynamic Application Content Container -->
    <main id="main-content" class="main-wrapper" role="main">
        <div class="loading-state">Initializing SUM Store...</div>
    </main>

    <!-- Toast Notification Overlay -->
    <div id="toast" class="toast" role="alert" aria-live="polite"></div>

    <!-- Global Footer -->
    <footer class="site-footer">
        <div class="footer-inner">
            <p>&copy; 2026 SUM Store. All rights reserved.</p>
            <p>Smart Technology &bull; Intelligent Robotics &bull; Modern Life</p>
        </div>
    </footer>

    <!-- Modular Vanilla Frontend Scripts (Zero build tooling) -->
    <script src="/js/api.js"></script>
    <script src="/js/store.js"></script>
    <script src="/js/router.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
