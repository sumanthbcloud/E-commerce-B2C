name: CI - Cart

on:
  push:
    branches:
      - main
    paths:
      - 'app/cart/**'
  pull_request:
    branches:
      - main
    paths:
      - 'app/cart/**'
  workflow_dispatch:

env:
  NODE_VERSION: "18"

jobs:
  application-validation:
    name: Application Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Validate Source Syntax
        run: node --check app/cart/server.js

  pipeline:
    name: Pipeline
    needs: application-validation
    uses: ./.github/workflows/reusable-service-ci.yml
    with:
      service_name: cart
      context: ./app/cart
      dockerfile: ./app/cart/Dockerfile
      image_name: sumstore/cart
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}


