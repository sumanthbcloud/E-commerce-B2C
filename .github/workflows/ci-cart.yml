name: CI - Cart

on:
  push:
    branches:
      - main
    paths:
      - 'app/cart/**'
  pull_request:
    branches:
      - main
    paths:
      - 'app/cart/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  pipeline:
    name: Pipeline
    uses: sumanthbcloud/Sumstore-Platform-Workflows/.github/workflows/node-service.yml@502b1d1a632a61158d43e525b438ed3eb4d82351
    with:
      service_name: cart
      runtime_version: "18"
      build_context: ./app/cart
      dockerfile: ./app/cart/Dockerfile
      gitops_values_path: helm/sumstore/values/cart.yaml
    secrets: inherit
