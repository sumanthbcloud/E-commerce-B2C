name: CI - User

on:
  push:
    branches:
      - main
    paths:
      - 'app/user/**'
  pull_request:
    branches:
      - main
    paths:
      - 'app/user/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  pipeline:
    name: Pipeline
    uses: sumanthbcloud/Sumstore-Platform-Workflows/.github/workflows/node-service.yml@v1
    with:
      service_name: user
      runtime_version: "18"
      build_context: ./app/user
      dockerfile: ./app/user/Dockerfile
      gitops_values_path: apps/user/values.yaml
    secrets: inherit


