name: CI - Web

on:
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - 'app/web/**'
      - '.github/workflows/ci-web.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'web/**'
      - 'app/web/**'
      - '.github/workflows/ci-web.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  pipeline:
    name: Pipeline
    uses: sumanthbcloud/Sumstore-Platform-Workflows/.github/workflows/web-service.yml@e5230ee6923dd44df8ac57df707d9c1ce7584b1e
    with:
      service_name: web
      build_context: ./app/web
      dockerfile: ./app/web/Dockerfile
      gitops_values_path: helm/sumstore/values/web.yaml
    secrets: inherit
