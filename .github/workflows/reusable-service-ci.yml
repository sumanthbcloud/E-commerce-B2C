# ==============================================================================
# Reusable Microservice CI Workflow
#
# Required GitHub Configuration (Configured in Repository / Organization Settings):
#
# GitHub Variables (vars):
#   - SONAR_HOST_URL                : SonarQube server URL (e.g. https://sonar.example.com)
#   - DOCKERHUB_USERNAME            : Docker Hub account username
#   - DOCKERHUB_REPOSITORY_PREFIX   : Prefix for Docker Hub repositories (e.g. sumstore)
#   - GITOPS_REPOSITORY             : GitHub repository for GitOps config (e.g. org/gitops-repo)
#   - GITOPS_BRANCH                 : Target branch in GitOps repo (e.g. main)
#
# GitHub Secrets (secrets):
#   - SONAR_TOKEN                   : Authentication token for SonarQube analysis
#   - DOCKERHUB_TOKEN               : Docker Hub Personal Access Token (PAT)
#   - GITOPS_TOKEN                  : GitHub PAT with push access to the GitOps repository
#   - SLACK_WEBHOOK_URL             : Slack incoming webhook URL for pipeline notifications
#
# Note: Values are dynamically referenced and never hardcoded in workflows.
# ==============================================================================

name: Reusable Service CI

on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
        description: "Name of the service (e.g. catalogue, cart, web)"

      context:
        required: true
        type: string
        description: "Docker build context directory"

      dockerfile:
        required: true
        type: string
        description: "Path to Dockerfile"

      image_name:
        required: true
        type: string
        description: "Docker target image name"

    secrets:
      SONAR_TOKEN:
        required: false

      DOCKERHUB_TOKEN:
        required: false

      GITOPS_TOKEN:
        required: false

      SLACK_WEBHOOK_URL:
        required: false


jobs:
  build:
    name: Build & Scan ${{ inputs.service_name }}
    runs-on: ubuntu-latest

    steps:

      # ========================================================================
      # Checkout
      # ========================================================================

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ========================================================================
      # Secret Scan
      # ========================================================================

      - name: Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


      # ========================================================================
      # SonarQube Scan
      # ========================================================================

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v3
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=sumstore-${{ inputs.service_name }}
            -Dsonar.sources=${{ inputs.context }}


      # ========================================================================
      # SonarQube Quality Gate
      # ========================================================================

      - name: SonarQube Quality Gate
        uses: sonarsource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}


      # ========================================================================
      # Docker Buildx
      # ========================================================================

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3


      # ========================================================================
      # Build Docker Image
      # ========================================================================

      - name: Build Image
        uses: docker/build-push-action@v5
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          load: true
          push: false

          tags: >
            ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPOSITORY_PREFIX }}-${{ inputs.service_name }}:${{ github.sha }}

          cache-from: type=gha
          cache-to: type=gha,mode=max


      # ========================================================================
      # Trivy Critical Scan
      # TEMPORARILY DISABLED
      # ========================================================================

      # - name: Trivy Critical Scan
      #   uses: aquasecurity/trivy-action@0.28.0
      #   with:
      #     image-ref: ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPOSITORY_PREFIX }}-${{ inputs.service_name }}:${{ github.sha }}
      #     format: 'table'
      #     exit-code: '1'
      #     ignore-unfixed: false
      #     severity: 'CRITICAL'


      # ========================================================================
      # Trivy High Scan
      # TEMPORARILY DISABLED
      # ========================================================================

      # - name: Trivy High Report
      #   if: always()
      #   uses: aquasecurity/trivy-action@0.28.0
      #   with:
      #     image-ref: ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPOSITORY_PREFIX }}-${{ inputs.service_name }}:${{ github.sha }}
      #     format: 'table'
      #     exit-code: '0'
      #     severity: 'HIGH'


      # ========================================================================
      # Docker Hub Login
      # ========================================================================

      - name: Docker Hub Login
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      # ========================================================================
      # Push Docker Image
      # ========================================================================

      - name: Push Image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE="${{ vars.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPOSITORY_PREFIX }}-${{ inputs.service_name }}:${{ github.sha }}"

          echo "Pushing image: $IMAGE"

          docker push "$IMAGE"


      # ========================================================================
      # Update GitOps Repository
      # ========================================================================

      - name: Update GitOps Image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |

          echo "Configuring Git..."

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"


          echo "Creating temporary GitOps directory..."

          GITOPS_DIR=$(mktemp -d)


          echo "Cloning GitOps repository..."

          git clone \
            --depth 1 \
            --branch "${{ vars.GITOPS_BRANCH }}" \
            "https://x-access-token:${{ secrets.GITOPS_TOKEN }}@github.com/${{ vars.GITOPS_REPOSITORY }}.git" \
            "$GITOPS_DIR"


          echo "GitOps repository cloned successfully."


          VALUES_FILE="$GITOPS_DIR/values/${{ inputs.service_name }}-values.yaml"


          echo "Looking for values file:"
          echo "$VALUES_FILE"


          if [ ! -f "$VALUES_FILE" ]; then
            echo "ERROR: GitOps values file not found:"
            echo "$VALUES_FILE"

            echo ""
            echo "Available files:"
            find "$GITOPS_DIR" -maxdepth 3 -type f

            exit 1
          fi


          NEW_REPO="${{ vars.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPOSITORY_PREFIX }}-${{ inputs.service_name }}"
          NEW_TAG="${{ github.sha }}"


          echo "Updating GitOps image..."

          echo "Repository: $NEW_REPO"
          echo "Tag: $NEW_TAG"


          yq -i \
            ".image.repository = \"$NEW_REPO\" | .image.tag = \"$NEW_TAG\"" \
            "$VALUES_FILE"


          echo "Updated values file:"

          cat "$VALUES_FILE"


          cd "$GITOPS_DIR"


          git add "values/${{ inputs.service_name }}-values.yaml"


          if git diff --staged --quiet; then

            echo "No changes detected in GitOps repository."

          else

            echo "Committing GitOps change..."

            git commit \
              -m "chore: deploy ${{ inputs.service_name }} ${{ github.sha }}"


            echo "Pushing GitOps change..."

            git push origin "${{ vars.GITOPS_BRANCH }}"


            echo "GitOps repository updated successfully."

          fi


      # ========================================================================
      # Slack Success Notification
      # ========================================================================

      - name: Notify Slack on Success
        if: success()
        run: |

          if [ -z "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
            echo "SLACK_WEBHOOK_URL is not configured."
            echo "Skipping Slack notification."
            exit 0
          fi


          IMAGE_REF="${{ vars.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPOSITORY_PREFIX }}-${{ inputs.service_name }}:${{ github.sha }}"

          EVENT="${{ github.event_name }}"


          if [ "$EVENT" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then

            DEPLOY_MSG="• *Docker Hub:* Image pushed successfully\n• *GitOps:* Repository updated successfully"

          else

            DEPLOY_MSG="• *Build & Scan:* Validation passed\n• *Deploy:* Skipped because this is not a main branch push"

          fi


          PAYLOAD=$(cat <<EOF
          {
            "text": "✅ Pipeline Succeeded: ${{ inputs.service_name }}",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "✅ *CI/CD Pipeline Succeeded*\n\n*Service:* \`${{ inputs.service_name }}\`\n*Commit:* \`${{ github.sha }}\`\n*Image:* \`$IMAGE_REF\`\n\n$DEPLOY_MSG\n\n*GitHub Run:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Pipeline>"
                }
              }
            ]
          }
          EOF
          )


          curl -s \
            -X POST \
            -H 'Content-type: application/json' \
            --data "$PAYLOAD" \
            "${{ secrets.SLACK_WEBHOOK_URL }}"


      # ========================================================================
      # Slack Failure Notification
      # ========================================================================

      - name: Notify Slack on Failure
        if: failure()
        run: |

          if [ -z "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
            echo "SLACK_WEBHOOK_URL is not configured."
            echo "Skipping Slack notification."
            exit 0
          fi


          IMAGE_REF="${{ vars.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPOSITORY_PREFIX }}-${{ inputs.service_name }}:${{ github.sha }}"


          PAYLOAD=$(cat <<EOF
          {
            "text": "❌ Pipeline Failed: ${{ inputs.service_name }}",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "❌ *CI/CD Pipeline Failed*\n\n*Service:* \`${{ inputs.service_name }}\`\n*Commit:* \`${{ github.sha }}\`\n*Image:* \`$IMAGE_REF\`\n*Event:* \`${{ github.event_name }}\`\n*Branch:* \`${{ github.ref }}\`\n\n*GitHub Run:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Failed Pipeline>"
                }
              }
            ]
          }
          EOF
          )


          curl -s \
            -X POST \
            -H 'Content-type: application/json' \
            --data "$PAYLOAD" \
            "${{ secrets.SLACK_WEBHOOK_URL }}"
