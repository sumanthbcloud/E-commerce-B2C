# ==============================================================================
# Reusable Microservice CI Workflow
#
# Supports:
#   - workflow_call
#   - workflow_dispatch
#
# GitHub Variables (vars):
#   - SONAR_HOST_URL
#   - DOCKERHUB_USERNAME
#   - DOCKERHUB_REPOSITORY_PREFIX
#   - GITOPS_REPOSITORY
#       Example: sumanthbcloud/Sumstore-GitOps
#   - GITOPS_BRANCH
#       Example: main
#
# GitHub Secrets (secrets):
#   - SONAR_TOKEN
#   - DOCKERHUB_TOKEN
#   - GITOPS_TOKEN
#   - SLACK_WEBHOOK_URL
#
# Manual workflow_dispatch will also:
#   - Build Docker image
#   - Login to Docker Hub
#   - Push Docker image
#   - Clone GitOps repository
#   - Update image tag
#   - Commit and push GitOps changes
#   - Send Slack notification
# ==============================================================================

name: Reusable Service CI

on:

  # ============================================================================
  # Manual Trigger
  # ============================================================================

  workflow_dispatch:
    inputs:

      service_name:
        description: "Name of the service (e.g. catalogue, cart, web)"
        required: true
        type: string

      context:
        description: "Docker build context directory"
        required: true
        type: string

      dockerfile:
        description: "Path to Dockerfile"
        required: true
        type: string

      image_name:
        description: "Docker target image name"
        required: true
        type: string


  # ============================================================================
  # Reusable Workflow
  # ============================================================================

  workflow_call:
    inputs:

      service_name:
        required: true
        type: string
        description: "Name of the service (e.g. catalogue, cart, web)"

      context:
        required: true
        type: string
        description: "Docker build context directory"

      dockerfile:
        required: true
        type: string
        description: "Path to Dockerfile"

      image_name:
        required: true
        type: string
        description: "Docker target image name"

    secrets:

      SONAR_TOKEN:
        required: false

      DOCKERHUB_TOKEN:
        required: false

      GITOPS_TOKEN:
        required: false

      SLACK_WEBHOOK_URL:
        required: false


# ==============================================================================
# Jobs
# ==============================================================================

jobs:

  build:

    name: Build & Scan ${{ inputs.service_name }}

    runs-on: ubuntu-latest


    steps:

      # =========================================================================
      # Checkout Application Repository
      # =========================================================================

      - name: Checkout
        uses: actions/checkout@v7

        with:
          fetch-depth: 0


      # =========================================================================
      # Secret Scan
      # =========================================================================

      - name: Secret Scan
        uses: gitleaks/gitleaks-action@v2

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


      # =========================================================================
      # SonarQube Scan
      # =========================================================================

      # - name: SonarQube Scan
      #   uses: sonarsource/sonarqube-scan-action@v3

      #   env:
      #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      #     SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

      #   with:
      #     args: >
      #       -Dsonar.projectKey=sumstore-${{ inputs.service_name }}
      #       -Dsonar.sources=${{ inputs.context }}


      # # =========================================================================
      # # SonarQube Quality Gate
      # # =========================================================================

      # - name: SonarQube Quality Gate
      #   uses: sonarsource/sonarqube-quality-gate-action@v1

      #   timeout-minutes: 5

      #   env:
      #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      #     SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}


      # =========================================================================
      # Docker Buildx
      # =========================================================================

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3


      # =========================================================================
      # Build Docker Image
      # =========================================================================

      - name: Build Image
        uses: docker/build-push-action@v5

        with:
          context: ${{ inputs.context }}

          file: ${{ inputs.dockerfile }}

          load: true

          push: false

          tags: >
            ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPOSITORY_PREFIX }}-${{ inputs.service_name }}:${{ github.sha }}

          cache-from: type=gha

          cache-to: type=gha,mode=max


      # =========================================================================
      # Trivy Critical Scan
      # TEMPORARILY DISABLED
      # =========================================================================

      # - name: Trivy Critical Scan
      #   uses: aquasecurity/trivy-action@0.28.0
      #
      #   with:
      #     image-ref: ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPOSITORY_PREFIX }}-${{ inputs.service_name }}:${{ github.sha }}
      #     format: 'table'
      #     exit-code: '1'
      #     ignore-unfixed: false
      #     severity: 'CRITICAL'


      # =========================================================================
      # Trivy High Scan
      # TEMPORARILY DISABLED
      # =========================================================================

      # - name: Trivy High Report
      #   if: always()
      #
      #   uses: aquasecurity/trivy-action@0.28.0
      #
      #   with:
      #     image-ref: ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPOSITORY_PREFIX }}-${{ inputs.service_name }}:${{ github.sha }}
      #     format: 'table'
      #     exit-code: '0'
      #     severity: 'HIGH'


      # =========================================================================
      # Docker Hub Login
      #
      # Runs for:
      #   - Manual workflow_dispatch
      #   - Push to main
      # =========================================================================

      - name: Docker Hub Login

        if: >
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main')

        uses: docker/login-action@v3

        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}

          password: ${{ secrets.DOCKERHUB_TOKEN }}


      # =========================================================================
      # Push Docker Image
      # =========================================================================

      - name: Push Image

        if: >
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main')

        run: |

          IMAGE="${{ vars.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPOSITORY_PREFIX }}-${{ inputs.service_name }}:${{ github.sha }}"

          echo "================================================="
          echo "Pushing Docker Image"
          echo "================================================="

          echo "Image: $IMAGE"

          docker push "$IMAGE"

          echo "Docker image pushed successfully."


      # =========================================================================
      # Update GitOps Repository
      # =========================================================================

      - name: Update GitOps Image

        if: >
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main')

        run: |

          echo "================================================="
          echo "Validating GitOps Configuration"
          echo "================================================="


          # ---------------------------------------------------------------------
          # Validate GitOps repository
          # ---------------------------------------------------------------------

          if [ -z "${{ vars.GITOPS_REPOSITORY }}" ]; then

            echo "ERROR: GITOPS_REPOSITORY variable is not configured."

            exit 1

          fi


          # ---------------------------------------------------------------------
          # Validate GitOps token
          # ---------------------------------------------------------------------

          if [ -z "${{ secrets.GITOPS_TOKEN }}" ]; then

            echo "ERROR: GITOPS_TOKEN secret is not configured."

            exit 1

          fi


          # ---------------------------------------------------------------------
          # Use configured branch or default to main
          # ---------------------------------------------------------------------

          GITOPS_BRANCH="${{ vars.GITOPS_BRANCH }}"

          if [ -z "$GITOPS_BRANCH" ]; then

            echo "GITOPS_BRANCH is not configured."

            echo "Defaulting GitOps branch to main."

            GITOPS_BRANCH="main"

          fi


          echo "GitOps Repository: ${{ vars.GITOPS_REPOSITORY }}"

          echo "GitOps Branch: $GITOPS_BRANCH"


          # =========================================================================
          # Configure Git
          # =========================================================================

          echo "================================================="
          echo "Configuring Git"
          echo "================================================="


          git config --global user.name "sumanthbcloud"

          git config --global user.email "sumanth26212@gmail.com"


          # =========================================================================
          # Temporary GitOps Directory
          # =========================================================================

          GITOPS_DIR=$(mktemp -d)


          echo "Temporary GitOps directory: $GITOPS_DIR"


          # =========================================================================
          # Clone GitOps Repository
          # =========================================================================

          echo "================================================="
          echo "Cloning GitOps Repository"
          echo "================================================="


          git clone \
            --depth 1 \
            --branch "$GITOPS_BRANCH" \
            "https://x-access-token:${{ secrets.GITOPS_TOKEN }}@github.com/${{ vars.GITOPS_REPOSITORY }}.git" \
            "$GITOPS_DIR"


          echo "GitOps repository cloned successfully."


          # =========================================================================
          # Locate Values File
          # =========================================================================

          SERVICE_NAME="${{ inputs.service_name }}"


          case "$SERVICE_NAME" in
            cart|catalogue|dispatch|payment|ratings|shipping|user|web)
              ;;
            *)
              echo "ERROR: Unsupported SUM Store service alias: $SERVICE_NAME"
              exit 1
              ;;
          esac


          VALUES_FILE="$GITOPS_DIR/helm/sumstore/values/${SERVICE_NAME}.yaml"


          echo "================================================="
          echo "Checking GitOps Values File"
          echo "================================================="


          echo "Expected values file:"

          echo "$VALUES_FILE"


          if [ ! -f "$VALUES_FILE" ]; then

            echo ""
            echo "ERROR: GitOps values file not found."

            echo ""
            echo "Expected:"
            echo "$VALUES_FILE"

            echo ""
            echo "Available files:"
            echo ""

            find "$GITOPS_DIR" \
              -maxdepth 5 \
              -type f \
              | sort

            exit 1

          fi


          # =========================================================================
          # New Docker Image
          # =========================================================================

          NEW_REPO="${{ vars.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPOSITORY_PREFIX }}-${{ inputs.service_name }}"

          NEW_TAG="${{ github.sha }}"


          echo "================================================="
          echo "Updating GitOps Image"
          echo "================================================="


          echo "Repository: $NEW_REPO"

          echo "Tag: $NEW_TAG"


          # =========================================================================
          # Update Helm Values
          # =========================================================================

          yq -i \
            ".${SERVICE_NAME}.image.repository = \"$NEW_REPO\" | .${SERVICE_NAME}.image.tag = \"$NEW_TAG\"" \
            "$VALUES_FILE"


          echo "================================================="
          echo "Updated Values File"
          echo "================================================="


          yq ".${SERVICE_NAME}.image" "$VALUES_FILE"


          # =========================================================================
          # Git Commit
          # =========================================================================

          cd "$GITOPS_DIR"


          git add \
            "helm/sumstore/values/${SERVICE_NAME}.yaml"


          if git diff --staged --quiet; then

            echo "No GitOps changes detected."

          else

            echo "================================================="
            echo "Committing GitOps Change"
            echo "================================================="


            git commit \
              -m "chore: deploy ${{ inputs.service_name }} ${{ github.sha }}"


            # =====================================================================
            # Git Push
            # =====================================================================

            echo "================================================="
            echo "Pushing GitOps Change"
            echo "================================================="


            git push \
              origin \
              "$GITOPS_BRANCH"


            echo "GitOps repository updated successfully."

          fi


      # =========================================================================
      # Slack Success Notification
      # =========================================================================

      - name: Notify Slack on Success

        if: success()

        run: |

          if [ -z "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then

            echo "SLACK_WEBHOOK_URL is not configured."

            echo "Skipping Slack success notification."

            exit 0

          fi


          IMAGE_REF="${{ vars.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPOSITORY_PREFIX }}-${{ inputs.service_name }}:${{ github.sha }}"


          # ---------------------------------------------------------------------
          # Manual Run
          # ---------------------------------------------------------------------

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then

            DEPLOY_MSG="• *Trigger:* Manual Run\n• *Docker Hub:* Image pushed successfully\n• *GitOps:* Repository updated successfully"


          # ---------------------------------------------------------------------
          # Main Push
          # ---------------------------------------------------------------------

          elif [ "${{ github.event_name }}" = "push" ] && \
               [ "${{ github.ref }}" = "refs/heads/main" ]; then

            DEPLOY_MSG="• *Trigger:* Main Branch Push\n• *Docker Hub:* Image pushed successfully\n• *GitOps:* Repository updated successfully"


          # ---------------------------------------------------------------------
          # Other reusable workflow invocation
          # ---------------------------------------------------------------------

          else

            DEPLOY_MSG="• *Build & Scan:* Validation completed\n• *Docker/GitOps:* Deployment steps were not executed for this trigger"

          fi


          PAYLOAD=$(cat <<EOF
          {
            "text": "✅ Pipeline Succeeded: ${{ inputs.service_name }}",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "✅ *SUM Store CI/CD Pipeline Succeeded*\n\n*Service:* \`${{ inputs.service_name }}\`\n*Commit SHA:* \`${{ github.sha }}\`\n*Image:* \`$IMAGE_REF\`\n\n$DEPLOY_MSG\n\n*GitHub Run:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Pipeline>"
                }
              }
            ]
          }
          EOF
          )


          echo "Sending Slack success notification..."


          curl \
            --fail \
            --silent \
            --show-error \
            -X POST \
            -H 'Content-type: application/json' \
            --data "$PAYLOAD" \
            "${{ secrets.SLACK_WEBHOOK_URL }}"


          echo ""

          echo "Slack success notification sent."


      # =========================================================================
      # Slack Failure Notification
      # =========================================================================

      - name: Notify Slack on Failure

        if: failure()

        run: |

          if [ -z "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then

            echo "SLACK_WEBHOOK_URL is not configured."

            echo "Skipping Slack failure notification."

            exit 0

          fi


          IMAGE_REF="${{ vars.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPOSITORY_PREFIX }}-${{ inputs.service_name }}:${{ github.sha }}"


          PAYLOAD=$(cat <<EOF
          {
            "text": "❌ Pipeline Failed: ${{ inputs.service_name }}",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "❌ *SUM Store CI/CD Pipeline Failed*\n\n*Service:* \`${{ inputs.service_name }}\`\n*Commit SHA:* \`${{ github.sha }}\`\n*Image:* \`$IMAGE_REF\`\n*Trigger:* \`${{ github.event_name }}\`\n*Branch:* \`${{ github.ref }}\`\n\n*GitHub Run:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Failed Pipeline>"
                }
              }
            ]
          }
          EOF
          )


          echo "Sending Slack failure notification..."


          curl \
            --fail \
            --silent \
            --show-error \
            -X POST \
            -H 'Content-type: application/json' \
            --data "$PAYLOAD" \
            "${{ secrets.SLACK_WEBHOOK_URL }}"


          echo ""

          echo "Slack failure notification sent."
