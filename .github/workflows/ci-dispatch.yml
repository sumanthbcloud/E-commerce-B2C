name: CI - Dispatch

on:
  push:
    branches:
      - main
    paths:
      - 'app/dispatch/**'
      - '.github/workflows/ci-dispatch.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'app/dispatch/**'
      - '.github/workflows/ci-dispatch.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  pipeline:
    name: Pipeline
    uses: sumanthbcloud/Sumstore-Platform-Workflows/.github/workflows/go-service.yml@v1
    with:
      service_name: dispatch
      go_version: "1.23"
      build_context: ./app/dispatch
      dockerfile: ./app/dispatch/Dockerfile
      gitops_values_path: apps/dispatch/values.yaml
    secrets: inherit

