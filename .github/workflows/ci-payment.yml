name: CI - Payment

on:
  push:
    branches:
      - main
    paths:
      - 'app/payment/**'
      - '.github/workflows/ci-payment.yml'
      - 'security/trivy/payment*'
  pull_request:
    branches:
      - main
    paths:
      - 'app/payment/**'
      - '.github/workflows/ci-payment.yml'
      - 'security/trivy/payment*'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  pipeline:
    name: Pipeline
    uses: sumanthbcloud/Sumstore-Platform-Workflows/.github/workflows/python-service.yml@v1
    with:
      service_name: payment
      python_version: "3.12"
      build_context: ./app/payment
      dockerfile: ./app/payment/Dockerfile
      gitops_values_path: apps/payment/values.yaml
      trivy_ignore_file: security/trivy/payment.trivyignore
    secrets: inherit
