name: CI - Payment

on:
  push:
    branches:
      - main
    paths:
      - 'app/payment/**'
  pull_request:
    branches:
      - main
    paths:
      - 'app/payment/**'
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.9"

jobs:
  application-validation:
    name: Application Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Validate Source Syntax
        run: python -m py_compile app/payment/*.py

  pipeline:
    name: Pipeline
    needs: application-validation
    uses: ./.github/workflows/reusable-service-ci.yml
    with:
      service_name: payment
      context: ./app/payment
      dockerfile: ./app/payment/Dockerfile
      image_name: sumstore/payment
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}


