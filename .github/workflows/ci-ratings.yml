name: CI - Ratings

on:
  push:
    branches:
      - main
    paths:
      - 'app/ratings/**'
      - '.github/workflows/ci-ratings.yml'
      - 'security/trivy/ratings*'
  pull_request:
    branches:
      - main
    paths:
      - 'app/ratings/**'
      - '.github/workflows/ci-ratings.yml'
      - 'security/trivy/ratings*'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  pipeline:
    name: Pipeline
    uses: sumanthbcloud/Sumstore-Platform-Workflows/.github/workflows/php-service.yml@v1
    with:
      service_name: ratings
      php_version: "8.2"
      build_context: ./app/ratings
      dockerfile: ./app/ratings/Dockerfile
      gitops_values_path: apps/ratings/values.yaml
      trivy_ignore_file: security/trivy/ratings.trivyignore
    secrets: inherit

