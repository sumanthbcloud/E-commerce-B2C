name: CI - Ratings

on:
  push:
    branches:
      - main
    paths:
      - 'app/ratings/**'
      - '.github/workflows/ci-ratings.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'app/ratings/**'
      - '.github/workflows/ci-ratings.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  pipeline:
    name: Pipeline
    uses: sumanthbcloud/Sumstore-Platform-Workflows/.github/workflows/php-service.yml@be11e4a76f5d06db7546306f2163114e23676509
    with:
      service_name: ratings
      php_version: "8.2"
      build_context: ./app/ratings
      dockerfile: ./app/ratings/Dockerfile
      gitops_values_path: helm/sumstore/values/ratings.yaml
    secrets: inherit

