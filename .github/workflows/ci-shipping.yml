name: CI - Shipping

on:
  push:
    branches:
      - main
    paths:
      - 'app/shipping/**'
      - '.github/workflows/ci-shipping.yml'
      - 'security/trivy/**'
  pull_request:
    branches:
      - main
    paths:
      - 'app/shipping/**'
      - '.github/workflows/ci-shipping.yml'
      - 'security/trivy/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  pipeline:
    name: Pipeline
    uses: sumanthbcloud/Sumstore-Platform-Workflows/.github/workflows/java-service.yml@v1
    with:
      service_name: shipping
      java_version: "17"
      build_context: ./app/shipping
      dockerfile: ./app/shipping/Dockerfile
      gitops_values_path: apps/shipping/values.yaml
      trivy_ignore_file: security/trivy/shipping.trivyignore
    secrets: inherit


