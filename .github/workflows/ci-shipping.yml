name: CI - Shipping

on:
  push:
    branches:
      - main
    paths:
      - 'app/shipping/**'
  pull_request:
    branches:
      - main
    paths:
      - 'app/shipping/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  pipeline:
    name: Pipeline
    uses: sumanthbcloud/Sumstore-Platform-Workflows/.github/workflows/java-service.yml@a6cec1f4665519cf6772dd462f34cf5f3418b7ee
    with:
      service_name: shipping
      java_version: "8"
      build_context: ./app/shipping
      dockerfile: ./app/shipping/Dockerfile
      gitops_values_path: helm/sumstore/values/shipping.yaml
    secrets: inherit


