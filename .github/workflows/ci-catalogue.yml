name: CI - Catalogue

on:
  push:
    branches:
      - main
    paths:
      - 'app/catalogue/**'
  pull_request:
    branches:
      - main
    paths:
      - 'app/catalogue/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  pipeline:
    name: Pipeline
    uses: sumanthbcloud/Sumstore-Platform-Workflows/.github/workflows/node-service.yml@v1
    with:
      service_name: catalogue
      runtime_version: "18"
      build_context: ./app/catalogue
      dockerfile: ./app/catalogue/Dockerfile
      gitops_values_path: helm/sumstore/values/catalogue.yaml
    secrets: inherit


